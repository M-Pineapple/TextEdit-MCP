# Glama builds this server from the swift:6.0-jammy image, which is Swift 6.0.3.
# Ubuntu 24.04 is the hosted runner Swift 6.0.3 still publishes a toolchain for.
# Writing an RTF needs macOS AppKit, so the one AppKit test is compiled out on Linux.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.0.3"

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
